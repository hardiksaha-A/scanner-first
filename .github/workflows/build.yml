name: Build APK
on: { push: { branches: [main, master] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - run: npm ci
      - run: node scripts/prep.js
      - run: npx cap add android
      - name: Add camera permission
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      # Optional: a fixed signing key lets each new APK install OVER the old one (keeps your data).
      # Without it every CI run signs with a brand-new random key and Android refuses the update.
      - name: Restore fixed debug signing key
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: LabelScanner-APK, path: android/app/build/outputs/apk/debug/app-debug.apk }
